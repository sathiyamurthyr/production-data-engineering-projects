version: 2

models:
  - name: int_customer_orders
    description: "Intermediate model aggregating historical order metrics per customer."
    columns:
      - name: customer_id
        description: "Natural customer identifier."
        tests:
          - unique
          - not_null
      - name: total_orders
        description: "Total count of orders placed by customer."
        tests:
          - not_null
      - name: total_spend
        description: "Lifetime spend sum across non-cancelled orders."
        tests:
          - not_null

  - name: int_order_items
    description: "Intermediate model enriching order line items with product margins and gross revenues."
    columns:
      - name: order_item_key
        description: "Hashed surrogate primary key combining order_id and product_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to parent order."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to line-item product."
        tests:
          - not_null
      - name: gross_margin
        description: "Calculated profit margin after accounting for item cost and applied discounts."
        tests:
          - not_null
