# Enterprise Azure Databricks Platform Configuration
# Environment: Production

azure_environment:
  subscription_id: "00000000-0000-0000-0000-000000000000"
  tenant_id: "11111111-1111-1111-1111-111111111111"
  resource_group: "rg-databricks-prod-eastus"
  location: "eastus"

databricks_workspace:
  name: "adb-medallion-prod"
  workspace_id: "1234567890123456"
  workspace_url: "https://adb-1234567890123456.16.azuredatabricks.net"
  managed_resource_group: "rg-databricks-prod-managed"
  pricing_tier: "Premium" # Required for Unity Catalog and VNet Injection

storage_accounts:
  primary_adls:
    account_name: "stmedallionprod"
    dfs_endpoint: "https://stmedallionprod.dfs.core.windows.net"
    containers:
      landing: "raw"
      bronze: "bronze"
      silver: "silver"
      gold: "gold"
      checkpoint: "checkpoints"
  unity_catalog_storage:
    account_name: "stucmetastoreprod"
    container: "metastore-root"

secret_scopes:
  key_vault_scope:
    scope_name: "akv-prod-scope"
    dns_name: "https://kv-databricks-prod.vault.azure.net/"
    resource_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-databricks-prod-eastus/providers/Microsoft.KeyVault/vaults/kv-databricks-prod"
    backend_type: "AZURE_KEYVAULT"
    secrets:
      adls_access_key: "adls-access-key"
      sp_client_secret: "sp-client-secret"
      synapse_sql_auth: "synapse-sql-auth"

unity_catalog:
  metastore_name: "uc_metastore_eastus"
  metastore_id: "uc-meta-99887766"
  catalogs:
    prod_catalog:
      name: "prod_catalog"
      schemas:
        - "bronze"
        - "silver"
        - "gold"
        - "analytics"

synapse_integration:
  server: "synw-prod-dw.sql.azuresynapse.net"
  database: "sqldw_analytics"
  staging_container: "synapse-staging"
  driver: "com.databricks.spark.sqldw"

monitoring:
  log_analytics_workspace_id: "22222222-2222-2222-2222-222222222222"
  diagnostic_logs_enabled: true
  application_insights_enabled: true
