# Topic Definitions Specification
# Used by src/admin/topic_manager.py for declarative provisioning

topics:
  - name: "sales-events"
    partitions: 6
    replication_factor: 1
    config:
      retention.ms: "604800000"       # 7 Days
      cleanup.policy: "delete"
      min.insync.replicas: "1"

  - name: "user-clicks"
    partitions: 3
    replication_factor: 1
    config:
      retention.ms: "259200000"       # 3 Days
      cleanup.policy: "delete"

  - name: "iot-readings"
    partitions: 12
    replication_factor: 1
    config:
      retention.ms: "86400000"        # 24 Hours
      cleanup.policy: "delete"

  - name: "cdc-user-updates"
    partitions: 3
    replication_factor: 1
    config:
      cleanup.policy: "compact"
      min.cleanable.dirty.ratio: "0.5"

  - name: "sales-events.DLQ"
    partitions: 3
    replication_factor: 1
    config:
      retention.ms: "1209600000"      # 14 Days
      cleanup.policy: "delete"
