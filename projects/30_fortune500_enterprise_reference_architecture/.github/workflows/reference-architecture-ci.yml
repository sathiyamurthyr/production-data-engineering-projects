name: Fortune 500 Enterprise Reference Architecture CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/30_fortune500_enterprise_reference_architecture/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'projects/30_fortune500_enterprise_reference_architecture/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Enterprise Architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/30_fortune500_enterprise_reference_architecture

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run architecture validation tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Validate required artifacts
        run: |
          for file in README.md executive-summary.md architecture.md \
                      governance.md security.md operations.md \
                      deployment-guide.md disaster-recovery.md requirements.txt; do
            test -f "$file" && echo "✓ $file exists" || { echo "✗ $file missing"; exit 1; }
          done

      - name: Validate Python modules
        run: |
          find reference-implementations tests -name "*.py" -exec python -m py_compile {} +
          echo "All Python modules validated"

  integration:
    name: Validate Project Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects

    steps:
      - uses: actions/checkout@v4

      - name: Verify Projects 01-29 Integration
        run: |
          projects=(
            "01_python_fundamentals"
            "04_python_etl_framework"
            "07_enterprise_pyspark"
            "08_delta_lake"
            "10_enterprise_databricks_lakehouse"
            "11_enterprise_apache_airflow"
            "12_enterprise_apache_kafka"
            "13_enterprise_spark_structured_streaming"
            "14_enterprise_dbt_analytics_engineering"
            "15_enterprise_snowflake_data_cloud"
            "21_enterprise_data_mesh"
            "22_enterprise_data_fabric"
            "23_enterprise_mlops_feature_platform"
            "24_enterprise_real_time_ai_platform"
            "25_enterprise_data_platform_sre"
            "26_enterprise_platform_engineering"
            "27_enterprise_data_security_privacy"
            "28_enterprise_multicloud_data_platform"
            "29_enterprise_agentic_ai_data_platform"
          )
          
          for project in "${projects[@]}"; do
            test -d "$project" && echo "✓ $project ready" || { echo "✗ $project missing"; exit 1; }
          done