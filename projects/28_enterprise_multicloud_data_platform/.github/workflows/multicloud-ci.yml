name: Enterprise Multi-Cloud Platform CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/28_enterprise_multicloud_data_platform/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'projects/28_enterprise_multicloud_data_platform/**'
  workflow_dispatch:

jobs:
  test:
    name: Test Multi-Cloud Platform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    defaults:
      run:
        working-directory: projects/28_enterprise_multicloud_data_platform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run type checks
        run: |
          python -m mypy shared/ azure/ aws/ --ignore-missing-imports

      - name: Run linting
        run: |
          python -m ruff check shared/ azure/ aws/ tests/

      - name: Run formatting check
        run: |
          python -m black --check shared/ azure/ aws/ tests/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/28_enterprise_multicloud_data_platform

    steps:
      - uses: actions/checkout@v4

      - name: Run Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'projects/28_enterprise_multicloud_data_platform'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/28_enterprise_multicloud_data_platform

    steps:
      - uses: actions/checkout@v4

      - name: Validate README
        run: |
          test -f README.md && echo "README exists"
          test -f architecture.md && echo "Architecture exists"
          test -f multicloud-guide.md && echo "Guide exists"
          test -f governance.md && echo "Governance exists"
          test -f deployment-guide.md && echo "Deployment guide exists"
          test -f disaster-recovery.md && echo "DR exists"
          test -f troubleshooting.md && echo "Troubleshooting exists"
          test -f interview-questions.md && echo "Interview questions exists"

      - name: Validate Python modules
        run: |
          for dir in shared azure aws tests; do
            find $dir -name "*.py" -exec python -m py_compile {} +
            echo "Validated: $dir"
          done