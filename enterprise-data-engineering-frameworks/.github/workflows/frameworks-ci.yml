name: Frameworks CI

on:
  push:
    branches: [main, master]
    paths:
      - 'enterprise-data-engineering-frameworks/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'enterprise-data-engineering-frameworks/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-data-engineering-frameworks

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml structlog python-dotenv pydantic click rich tenacity

      - name: Run tests
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} +
          python -m pytest -v --tb=short --cov=./ --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: .
          files: ./coverage.xml
          fail_ci_if_error: false
